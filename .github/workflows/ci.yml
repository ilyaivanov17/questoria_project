name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate monorepo
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://questoria:questoria_local_only@localhost:5432/questoria?schema=public
      WEB_ORIGIN: http://localhost:3000
      EMAIL_PROVIDER: console
      MFA_ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: |
          docker compose -f infra/docker/docker-compose.yml up -d postgres
          for attempt in $(seq 1 30); do
            if docker compose -f infra/docker/docker-compose.yml exec -T postgres pg_isready -U questoria -d questoria; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f infra/docker/docker-compose.yml logs postgres
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Replace with --frozen-lockfile after the first pnpm install
      # and commit of pnpm-lock.yaml.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Shell syntax check
        run: bash -n scripts/db-backup.sh scripts/db-restore.sh

      - name: Lint
        run: pnpm lint

      - name: Validate Prisma schema
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Seed the demo quest
        run: pnpm db:seed

      - name: Backup and restore PostgreSQL smoke test
        run: |
          set -euo pipefail
          docker compose -f infra/docker/docker-compose.yml exec -T postgres createdb -U questoria questoria_restore_check
          pnpm run db:backup -- /tmp/questoria-ci.dump
          if ALLOW_DATABASE_RESTORE=0 pnpm run db:restore -- /tmp/questoria-ci.dump --confirm-database questoria_restore_check; then
            echo "Restore safety gate did not block an unapproved restore." >&2
            exit 1
          fi
          ALLOW_DATABASE_RESTORE=1 DATABASE_URL="postgresql://questoria:questoria_local_only@localhost:5432/questoria_restore_check?schema=public" pnpm run db:restore -- /tmp/questoria-ci.dump --confirm-database questoria_restore_check
          source_counts="$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U questoria -d questoria -Atqc "SELECT (SELECT COUNT(*) FROM quests)::text || ':' || (SELECT COUNT(*) FROM categories)::text || ':' || (SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL)::text")"
          restored_counts="$(docker compose -f infra/docker/docker-compose.yml exec -T postgres psql -U questoria -d questoria_restore_check -Atqc "SELECT (SELECT COUNT(*) FROM quests)::text || ':' || (SELECT COUNT(*) FROM categories)::text || ':' || (SELECT COUNT(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL)::text")"
          test "$source_counts" = "$restored_counts"
          echo "PostgreSQL backup/restore verified: $restored_counts"

      - name: Remove restore test database
        if: always()
        run: |
          docker compose -f infra/docker/docker-compose.yml exec -T postgres dropdb -U questoria --if-exists --force questoria_restore_check || true

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Start API for smoke test
        run: |
          pnpm --filter @questoria/api start > /tmp/questoria-api.log 2>&1 &
          echo "$!" > /tmp/questoria-api.pid

      - name: End-to-end smoke test
        env:
          API_LOG_FILE: /tmp/questoria-api.log
        run: node scripts/smoke.mjs

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/questoria-api.pid ]; then
            kill "$(cat /tmp/questoria-api.pid)" || true
          fi

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml down --volumes --remove-orphans
