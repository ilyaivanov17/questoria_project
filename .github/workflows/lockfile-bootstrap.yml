name: Generate pnpm workspace lockfile

on:
  push:
    branches: [qa/codespaces-release-readiness]
    paths:
      - .github/workflows/lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    name: Resolve and commit workspace lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.17.0

      - name: Generate lockfile without installing packages
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate lockfile workspace importers
        run: |
          test -s pnpm-lock.yaml
          grep -q '^lockfileVersion:' pnpm-lock.yaml
          grep -q '^  apps/api:' pnpm-lock.yaml
          grep -q '^  apps/web:' pnpm-lock.yaml
          grep -q '^  packages/contracts:' pnpm-lock.yaml

      - name: Commit lockfile and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/lockfile-bootstrap.yml
          git commit -m "build(deps): commit pnpm workspace lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
